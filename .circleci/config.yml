version: 2
jobs:
  build:
    working_directory: ~/workspace
    docker:
      - image: cimg/python:3.7.17-node
    environment:
      PYENV_VERSION: 3.7.17
    steps:
      - checkout
      - run:
          name: Node.js修正版を準備
          command: |
            set -eu
            cd /tmp
            curl -fsSLO https://nodejs.org/dist/v26.13.1/node-v26.13.1-linux-x64.tar.xz
            curl -fsSLO https://nodejs.org/dist/v26.13.1/SHASUMS256.txt
            grep ' node-v26.13.1-linux-x64.tar.xz$' SHASUMS256.txt | sha256sum --check -
            sudo tar -xJf node-v26.13.1-linux-x64.tar.xz --strip-components=1 -C /usr/local
      - run:
          name: System information
          command: |
            python3 --version
            pip3 --version
            echo "Node $(node -v)"
            echo "Yarn v$(yarn --version)"
      - restore_cache:
          keys:
            - v2-node26-{{ arch }}-{{ checksum "server/requirements.txt" }}-{{ checksum "frontend/yarn.lock" }}
            - v2-node26-{{ arch }}-{{ checksum "server/requirements.txt" }}
            - v2-node26-{{ arch }}
      - run:
          name: Install dependencies (Python)
          command: |
            pip3 install -q -r requirements.txt \
              --index-url https://repo.fury.io/emoji-gen/ --extra-index-url https://pypi.org/simple
          working_directory: server
      - run:
          name: Install dependencies (Node)
          command: yarn
          working_directory: frontend
      - run:
          name: Test (Node)
          command: |
            yarn test
            yarn run build
          working_directory: frontend
      - run:
          name: Check git dirty
          command: |
            if [ "$CIRCLE_BRANCH" = "master" ]; then
              ./common/script/is-git-dirty.sh
            fi
      - save_cache:
          key: v2-node26-{{ arch }}-{{ checksum "server/requirements.txt" }}-{{ checksum "frontend/yarn.lock" }}
          paths:
            - ~/workspace/frontend/node_modules
            - ~/.cache/yarn/
            - ~/.cache/pip/
      - run:
          name: Notify test failed
          command: |
            if [ "$CIRCLE_BRANCH" = "master" ]; then
              pip3 install -q slackweb
              python3 common/script/notify.py failed
            fi
          when: on_fail
